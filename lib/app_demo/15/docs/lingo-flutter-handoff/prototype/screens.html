<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD83D"><title>Pip · 关键界面</title>
<link rel="icon" href="assets/pip.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css">
<style>
  .showcase{max-width:1320px;margin:0 auto;padding:44px 28px 56px}
  .showcase-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px}
  .showcase-head .brand{font-size:46px;display:inline-block}
  .showcase-head h1{font-size:28px;font-weight:1000;letter-spacing:-.9px;margin-top:9px}
  .showcase-head p{font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
  .showcase-link{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border:2px solid var(--ink);border-radius:14px;background:var(--yellow);box-shadow:0 4px 0 var(--ink);font-size:14px;font-weight:900;color:var(--ink);text-decoration:none;flex:none}
  .showcase-link:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .frames{display:grid;grid-template-columns:repeat(3,minmax(0,390px));gap:36px;justify-content:center}
  .frame{display:flex;flex-direction:column;gap:13px;min-width:0}
  .frame-label{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:900}
  .frame-label .num{width:24px;height:24px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);display:grid;place-items:center;font-family:Nunito,sans-serif;font-size:12px}
  .frame-label small{font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}
  .phone{width:100%;height:844px;border:2px solid var(--ink);border-radius:34px;background:var(--paper);box-shadow:0 10px 0 #d9dbd0;overflow:hidden}
  .phone iframe{display:block;width:100%;height:100%;border:0}
  @media(max-width:1300px){.frames{grid-template-columns:repeat(2,minmax(0,390px))}}
  @media(max-width:900px){.showcase{padding:28px 18px 40px}.showcase-head{flex-direction:column;align-items:flex-start}.frames{grid-template-columns:minmax(0,390px);gap:30px}.phone{height:844px}}
  @media(max-height:790px){.phone{height:844px}}
</style>
</head>
<body>
<main class="showcase">
  <header class="showcase-head">
    <div>
      <div class="brand" aria-label="Pip">pip</div>
      <h1>关键界面</h1>
      <p>学习路径、答题反馈与课后结算。每一帧都是可交互的原型。</p>
    </div>
    <a class="showcase-link" href="index.html">进入完整原型 →</a>
  </header>
  <div class="frames">
    <section class="frame" aria-labelledby="frame-path">
      <div class="frame-label"><span class="num">1</span><span id="frame-path">学习路径</span><small>解锁 · 每日目标</small></div>
      <div class="phone"><iframe src="index.html?screen=path&amp;wall=1" title="学习路径" loading="eager"></iframe></div>
    </section>
    <section class="frame" aria-labelledby="frame-quiz">
      <div class="frame-label"><span class="num">2</span><span id="frame-quiz">答题反馈</span><small>选词填空 · 答对</small></div>
      <div class="phone"><iframe src="index.html?screen=quiz&amp;state=correct&amp;sound=on&amp;wall=1" title="答题反馈" loading="eager"></iframe></div>
    </section>
    <section class="frame" aria-labelledby="frame-finish">
      <div class="frame-label"><span class="num">3</span><span id="frame-finish">课后结算</span><small>奖励 · 连续学习</small></div>
      <div class="phone"><iframe src="index.html?screen=complete&amp;wall=1" title="课后结算" loading="eager"></iframe></div>
    </section>
  </div>
</main>
</body>
</html>
